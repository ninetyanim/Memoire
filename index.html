<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E1E22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memoire">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Memoire</title><!-- v34 fix -->
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<style>
:root{--bg:#1E1E22;--sidebar-bg:#18181E;--border:#2A2A32;--accent-light:#7878A0;--accent:#505078;--text-title:#E0E0F0;--text-body:#B0B0C0;--text-muted:#707088;--tag:#8080A8;--today-bg:#505078;--card-bg:#23232A;--hover:#25252D;--fs-title:20px;--fs-subtitle:16px;--fs-body:15px;--fs-btn:14px;--fs-small:12px;--warn:#C08838;--warn-bg:rgba(192,136,56,0.12);}
.theme-warm{--bg:#1E1A14;--sidebar-bg:#19160F;--border:#2C2318;--accent-light:#B8762A;--accent:#9A5E18;--text-title:#E8DEC4;--text-body:#B8A888;--text-muted:#887060;--tag:#B8762A;--today-bg:#9A5E18;--card-bg:#232018;--hover:#272318;}
.theme-teal{--bg:#181E20;--sidebar-bg:#131A1C;--border:#222E32;--accent-light:#3AA898;--accent:#1E7868;--text-title:#D8E8E4;--text-body:#8AACAC;--text-muted:#5A7878;--tag:#3AA898;--today-bg:#1E7868;--card-bg:#1C2426;--hover:#1F2A2C;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;background:var(--bg);color:var(--text-title);font-size:var(--fs-body);height:100vh;height:100dvh;overflow:hidden;}  /* v45.1：100dvh = 手機實際可見高度（不含網址列、工具列）；舊瀏覽器不支援時沿用上一行的 100vh */
#app{display:flex;height:100vh;height:100dvh;overflow:hidden;}

#sidebar{width:240px;min-width:240px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width 0.2s,min-width 0.2s;}
#sidebar.collapsed{width:0;min-width:0;border-right:none;}
.sidebar-header{padding:12px 12px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.app-name{font-size:var(--fs-subtitle);font-weight:600;color:var(--text-title);}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:3px 6px;border-radius:4px;font-size:var(--fs-btn);line-height:1;}
.icon-btn:hover{color:var(--accent-light);}
#calendar{padding:10px 8px 6px;flex-shrink:0;}
.cal-nav{display:flex;align-items:center;gap:2px;margin-bottom:6px;}
.cal-nav-selects{display:flex;gap:3px;flex:1;}
.cal-nav-select-wrap{position:relative;display:inline-flex;align-items:center;}
.cal-nav-select-wrap::after{content:'▾';position:absolute;right:4px;font-size:8px;color:var(--accent-light);pointer-events:none;}
.cal-nav-select{background:var(--card-bg);border:1px solid var(--border);border-radius:4px;color:var(--text-body);font-size:var(--fs-small);padding:2px 16px 2px 6px;cursor:pointer;font-family:inherit;appearance:none;-webkit-appearance:none;width:100%;}
.cal-nav-select:hover{border-color:var(--accent-light);color:var(--text-title);}
.cal-nav-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:var(--fs-btn);padding:2px 4px;border-radius:3px;line-height:1;display:inline-flex;align-items:center;}
.cal-nav-btn:hover{color:var(--text-title);}
.cal-today-btn{background:none;border:1px solid var(--border);cursor:pointer;color:var(--accent-light);font-size:var(--fs-small);padding:1px 6px;border-radius:3px;font-family:inherit;white-space:nowrap;}
.cal-today-btn:hover{border-color:var(--accent-light);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:1px;}
.cal-dow{font-size:var(--fs-small);color:var(--text-muted);text-align:center;padding:1px 0 3px;}
.cal-day{font-size:var(--fs-small);text-align:center;padding:3px 1px;border-radius:50%;cursor:pointer;color:var(--text-body);aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;transition:background 0.1s;}
.cal-day:hover{background:var(--hover);}
.cal-day.today{background:var(--today-bg);color:var(--text-title);font-weight:600;}
.cal-day.has-entry::after{content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--accent-light);}
.cal-day.selected{outline:1.5px solid var(--accent-light);}
.cal-day.other-month{opacity:0.35;}
#search-wrap{padding:6px 10px;border-bottom:1px solid var(--border);flex-shrink:0;}
#search-box{width:100%;background:var(--card-bg);border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:var(--fs-small);color:var(--text-title);font-family:inherit;outline:none;transition:border-color 0.15s;}
#search-box::placeholder{color:var(--text-muted);}
#search-box:focus{border-color:var(--accent-light);}
#entry-list{flex:1;overflow-y:auto;}
.entry-item{padding:7px 12px;cursor:pointer;border-left:2px solid transparent;display:flex;align-items:center;gap:6px;transition:background 0.1s;}
.entry-item:hover{background:var(--hover);}
.entry-item.active{border-left-color:var(--accent-light);background:var(--hover);}
.entry-item-text{flex:1;min-width:0;}
.entry-date{font-size:var(--fs-small);color:var(--text-muted);margin-bottom:1px;}
.entry-title-s{font-size:var(--fs-btn);color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry-del{display:none;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:var(--fs-btn);padding:2px 4px;border-radius:3px;flex-shrink:0;}
.entry-item:hover .entry-del{display:block;}
.entry-del:hover{color:#c05050;}
.sidebar-footer{padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:5px;align-items:center;flex-shrink:0;}
.theme-dot{width:12px;height:12px;border-radius:50%;cursor:pointer;border:1.5px solid transparent;}
.theme-dot.active{border-color:var(--text-title);}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--sidebar-bg);flex-shrink:0;}
.toggle-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:var(--fs-subtitle);padding:2px 4px;border-radius:3px;line-height:1;}
.toggle-btn:hover{color:var(--accent-light);}
.topbar-title{font-size:var(--fs-subtitle);color:var(--text-body);flex:1;}
.new-btn{background:var(--accent);border:none;border-radius:5px;padding:5px 14px;font-size:var(--fs-btn);color:var(--text-title);cursor:pointer;font-family:inherit;}
.new-btn:hover{background:var(--accent-light);}

#list-page{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.list-month-group{margin-bottom:4px;}
.list-month-label{font-size:var(--fs-subtitle);font-weight:600;color:var(--text-title);padding:10px 14px 8px;background:var(--sidebar-bg);letter-spacing:0.3px;position:sticky;top:0;z-index:1;}
.list-cards-wrap{padding:6px 10px;display:flex;flex-direction:column;gap:6px;}
.list-card{display:flex;background:var(--card-bg);border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:background 0.1s;position:relative;overflow:hidden;}
.list-card:hover{background:var(--hover);border-color:var(--accent-light);}
.list-card-left{width:58px;flex-shrink:0;padding:12px 0 12px 12px;display:flex;flex-direction:column;align-items:center;}
.list-card-dow{font-size:var(--fs-small);color:var(--text-muted);margin-bottom:2px;}
.list-card-day{font-size:26px;font-weight:600;color:var(--accent-light);line-height:1;}
.list-card-divider{width:1px;background:var(--border);margin:10px 0;flex-shrink:0;align-self:stretch;}
.list-card-body{flex:1;padding:11px 36px 11px 12px;min-width:0;}
.list-card-title{font-size:var(--fs-subtitle);font-weight:600;color:var(--text-title);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-card-preview{font-size:var(--fs-body);color:var(--text-body);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.list-card-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;align-items:center;}
.list-card-tag{font-size:var(--fs-small);color:var(--tag);background:rgba(128,128,168,0.12);padding:1px 5px;border-radius:3px;cursor:pointer;}
.list-card-del{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:var(--fs-btn);padding:4px 6px;border-radius:4px;display:none;}
.list-card:hover .list-card-del{display:block;}
.list-card-del:hover{color:#c05050;}
.sync-badge{position:absolute;top:8px;right:10px;display:flex;align-items:center;gap:3px;font-size:var(--fs-small);color:var(--warn);cursor:pointer;z-index:1;}
.sync-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--warn);flex-shrink:0;}
.sync-banner{background:var(--warn-bg);border:1px solid rgba(192,136,56,0.35);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;margin:8px 14px;}
.sync-banner-icon{font-size:var(--fs-subtitle);line-height:1;flex-shrink:0;margin-top:1px;}
.sync-banner-body{flex:1;min-width:0;}
.sync-banner-title{font-size:var(--fs-btn);color:var(--text-title);font-weight:600;margin-bottom:2px;}
.sync-banner-desc{font-size:var(--fs-small);color:var(--text-body);line-height:1.5;margin-bottom:8px;}
.sync-banner-actions{display:flex;gap:8px;}
.sync-btn-primary{background:var(--warn);border:none;color:#1E1E22;font-size:var(--fs-small);padding:4px 12px;border-radius:5px;cursor:pointer;font-family:inherit;font-weight:600;}
.sync-btn-primary:hover{opacity:0.88;}
.sync-btn-secondary{background:none;border:1px solid var(--border);color:var(--text-body);font-size:var(--fs-small);padding:4px 12px;border-radius:5px;cursor:pointer;font-family:inherit;}
.sync-btn-secondary:hover{border-color:var(--accent-light);color:var(--text-title);}
.leave-confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:400;}
.leave-confirm-box{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:20px;width:90%;max-width:340px;}
.leave-confirm-icon{font-size:22px;margin-bottom:8px;}
.leave-confirm-title{font-size:var(--fs-subtitle);font-weight:600;color:var(--text-title);margin-bottom:8px;line-height:1.4;}
.leave-confirm-desc{font-size:var(--fs-small);color:var(--text-body);line-height:1.6;margin-bottom:18px;}
.leave-confirm-actions{display:flex;gap:8px;}
.leave-confirm-actions button{flex:1;font-family:inherit;font-size:var(--fs-btn);padding:8px 0;border-radius:6px;cursor:pointer;}
.leave-confirm-btn-stay{background:var(--warn);border:none;color:#1E1E22;font-weight:600;}
.leave-confirm-btn-stay:hover{opacity:0.88;}
.leave-confirm-btn-leave{background:none;border:1px solid var(--border);color:var(--text-body);}
.leave-confirm-btn-leave:hover{border-color:var(--accent-light);color:var(--text-title);}
/* ── 標籤批次處理進度（v46）── */
.tag-progress{padding:8px 16px;font-size:var(--fs-small);color:var(--accent-light);background:var(--card-bg);border-bottom:1px solid var(--border);}
/* ── 其他裝置修改提示（v44）── */
.editor-toast-wrap{display:flex;justify-content:center;padding:8px 14px 0;flex-shrink:0;}
.editor-toast{display:inline-flex;align-items:center;gap:6px;background:var(--card-bg);border:1px solid var(--accent);border-radius:16px;padding:5px 14px;font-size:var(--fs-small);color:var(--text-body);animation:fadeIn 0.25s;}
.editor-toast svg{color:var(--accent-light);flex-shrink:0;}
#conflict-banner-mount .sync-banner{flex-shrink:0;}
/* ── 鎖定頁（v42：輸入暗號）── */
#lock-screen{position:fixed;inset:0;z-index:500;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;}
#lock-screen.visible{display:flex;}
.lock-box{width:100%;max-width:300px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.lock-icon{color:var(--accent-light);display:flex;}
.lock-title{font-size:var(--fs-title);font-weight:600;color:var(--text-title);}
.lock-desc{font-size:var(--fs-small);color:var(--text-muted);text-align:center;line-height:1.5;}
.lock-desc.expired{color:var(--warn);}
.lock-field{width:100%;display:flex;align-items:center;background:var(--card-bg);border:1px solid var(--border);border-radius:6px;padding:0 4px 0 12px;transition:border-color 0.15s;}
.lock-field:focus-within{border-color:var(--accent-light);}
.lock-field.error{border-color:var(--warn);}
.lock-input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text-title);font-size:var(--fs-body);font-family:inherit;padding:9px 0;}
.lock-input::placeholder{color:var(--text-muted);}
.lock-eye{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:6px 8px;display:flex;align-items:center;}
.lock-eye:hover{color:var(--accent-light);}
.lock-error{width:100%;font-size:var(--fs-small);color:var(--warn);min-height:1em;display:none;}
.lock-error.visible{display:block;}
.lock-submit{width:100%;background:var(--accent);border:none;border-radius:6px;padding:9px 0;font-size:var(--fs-btn);color:var(--text-title);cursor:pointer;font-family:inherit;}
.lock-submit:hover{background:var(--accent-light);}
.lock-submit:disabled{opacity:0.7;cursor:default;background:var(--accent);}
.sync-settings-item{display:flex;align-items:center;justify-content:space-between;background:var(--hover);border-radius:6px;padding:8px 10px;margin-bottom:6px;}
.sync-settings-item-label{font-size:var(--fs-small);color:var(--text-body);}
.lc-meta-item{font-size:var(--fs-small);color:var(--text-body);}
.lc-meta-dot{font-size:var(--fs-small);color:var(--text-muted);margin:0 4px;}
.search-highlight{background:rgba(120,120,160,0.35);border-radius:2px;padding:0 1px;}
.search-result-count{font-size:var(--fs-small);color:var(--text-muted);padding:6px 14px 2px;}
.list-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);gap:10px;padding:40px;}

#editor-page{flex:1;display:none;flex-direction:column;overflow:hidden;}
.editor-topbar{padding:7px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--sidebar-bg);flex-shrink:0;}
.back-btn{background:none;border:1px solid var(--border);cursor:pointer;color:var(--text-body);font-size:var(--fs-btn);padding:3px 10px;border-radius:4px;font-family:inherit;display:inline-flex;align-items:center;gap:5px;}
.back-btn:hover{color:var(--text-title);}
.editor-date{font-size:var(--fs-btn);color:var(--text-body);flex:1;}
.save-status{font-size:var(--fs-small);color:var(--text-muted);}
.save-status.saving{color:var(--accent-light);}
.del-btn{background:none;border:1px solid #7a3030;cursor:pointer;color:#c05050;font-size:var(--fs-btn);padding:3px 10px;border-radius:4px;font-family:inherit;}
.del-btn:hover{background:#3a1a1a;border-color:#c05050;color:#e07070;}
.analyze-btn{background:none;border:1px solid var(--border);cursor:pointer;color:var(--accent-light);font-size:var(--fs-btn);padding:3px 10px;border-radius:4px;font-family:inherit;}
.analyze-btn:hover{border-color:var(--accent-light);background:rgba(120,120,160,0.1);}
.analyze-btn:disabled{opacity:0.5;cursor:not-allowed;}

/* quill-mount: toolbar 自動排第一，其餘由 #editor-body 管 */
#quill-mount{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}

/* Quill toolbar */
.ql-toolbar.ql-snow{background:var(--sidebar-bg) !important;border:none !important;border-bottom:1px solid var(--border) !important;padding:6px 14px !important;flex-shrink:0;}
.ql-toolbar.ql-snow .ql-stroke{stroke:#C8C8DC !important;stroke-width:1.6px !important;}
.ql-toolbar.ql-snow .ql-fill{fill:#C8C8DC !important;}
.ql-toolbar.ql-snow button:hover .ql-stroke,.ql-toolbar.ql-snow .ql-active .ql-stroke{stroke:#FFFFFF !important;}
.ql-toolbar.ql-snow button:hover .ql-fill,.ql-toolbar.ql-snow .ql-active .ql-fill{fill:#FFFFFF !important;}
.ql-toolbar.ql-snow .ql-picker{color:#C8C8DC !important;font-size:var(--fs-small) !important;}
.ql-toolbar.ql-snow .ql-picker-label{border-color:var(--border) !important;color:#C8C8DC !important;}
.ql-snow .ql-picker-options{background:var(--card-bg) !important;border-color:var(--border) !important;}
.ql-snow .ql-picker-item{color:var(--text-body) !important;}
.ql-snow .ql-picker-item:hover,.ql-snow .ql-picker-item.ql-selected{color:var(--text-title) !important;}
.ql-snow .ql-tooltip{background:var(--card-bg) !important;border-color:var(--border) !important;color:var(--text-body) !important;z-index:10;}

/* 底色按鈕：圖示 + 下方目前選色提示條 */
.ql-toolbar.ql-snow .ql-highlight{display:flex !important;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:28px;height:28px;padding:2px 0 3px !important;}
.ql-toolbar.ql-snow .ql-highlight svg{width:14px;height:14px;}
.ql-hl-bar{width:14px;height:3px;border-radius:2px;background:rgba(255,224,80,0.9);opacity:0.25;flex-shrink:0;}

/* 底色色盤 popup */
.hl-palette{position:fixed;display:flex;gap:5px;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:7px;z-index:50;}
.hl-swatch{width:24px;height:24px;border:1.5px solid transparent;border-radius:5px;cursor:pointer;padding:0;font-size:11px;color:var(--text-muted);}
.hl-swatch:hover{border-color:var(--text-title);}
.hl-swatch.hl-none{background:transparent;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}

/* 分隔線：純視覺橫線 */
.ql-editor hr{border:none;border-top:1px solid var(--border);margin:14px 0;}

/* editor-body: title → tags → quill content，flex column，可捲動 */
#editor-body{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* title + tags */
#title-input{width:100%;padding:12px 16px 4px;font-size:var(--fs-title);font-weight:600;background:transparent;border:none;outline:none;color:var(--text-title);font-family:inherit;flex-shrink:0;}
#title-input::placeholder{color:var(--text-muted);}
#tags-row{padding:4px 16px 8px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;flex-shrink:0;border-bottom:1px solid var(--border);}
.tag-chip{font-size:var(--fs-small);color:var(--tag);background:rgba(128,128,168,0.15);padding:2px 8px;border-radius:8px;cursor:pointer;position:relative;}
.tag-chip:hover{background:rgba(128,128,168,0.28);}
.tag-chip-suggested{font-size:var(--fs-small);color:var(--accent-light);background:transparent;padding:2px 8px;border-radius:8px;cursor:pointer;border:1px dashed var(--accent-light);opacity:0.75;position:relative;transition:all 0.15s;}
.tag-chip-suggested:hover{opacity:1;background:rgba(128,128,168,0.12);}
.tag-chip-suggested .tag-x{display:none;margin-left:4px;opacity:0.6;}
.tag-chip-suggested:hover .tag-x{display:inline;}
.tag-add{font-size:var(--fs-small);color:var(--accent-light);cursor:pointer;padding:2px 7px;border-radius:8px;border:1px dashed var(--accent-light);opacity:0.7;}
.tag-add:hover{opacity:1;}

/* ── Meta bar（日期列 + 天氣地點列）── */
#date-meta-wrap{flex-shrink:0;border-bottom:1px solid var(--border);}
#date-row{padding:14px 16px 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.date-main{font-size:var(--fs-title);color:var(--text-title);font-weight:600;}
.date-dot{color:var(--text-muted);font-size:var(--fs-subtitle);}
.date-festival{font-size:var(--fs-subtitle);color:var(--accent-light);font-weight:500;}
.date-jieqi{font-size:var(--fs-small);color:var(--text-body);background:rgba(120,120,160,0.13);border:1px solid rgba(120,120,160,0.2);padding:1px 8px;border-radius:8px;}
#weather-location-row{padding:2px 16px 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:24px;}
.wl-item{display:flex;align-items:center;gap:5px;font-size:var(--fs-small);color:var(--text-body);}
.wl-divider{width:1px;height:11px;background:var(--border);}
.wl-loading{font-size:var(--fs-small);color:var(--text-muted);opacity:0.4;font-style:italic;}
/* 地點可點擊編輯 */

/* ── 設定頁 ── */
#settings-page{flex:1;display:none;flex-direction:column;overflow:hidden;}

.settings-section{margin-bottom:24px;}
.settings-section-title{font-size:var(--fs-btn);font-weight:600;color:var(--text-muted);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}

.settings-desc{font-size:var(--fs-small);color:var(--text-muted);margin-top:2px;}

/* Toggle switch */
.toggle-switch{position:relative;width:36px;height:20px;flex-shrink:0;}
.toggle-switch input{opacity:0;width:0;height:0;position:absolute;}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:10px;cursor:pointer;transition:background 0.2s;}
.toggle-slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:var(--text-muted);border-radius:50%;transition:transform 0.2s,background 0.2s;}
.toggle-switch input:checked+.toggle-slider{background:var(--accent);}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(16px);background:var(--text-title);}
/* Segment control */
.seg-control{display:flex;background:var(--sidebar-bg);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.seg-btn{background:none;border:none;padding:4px 12px;font-size:var(--fs-small);color:var(--text-muted);cursor:pointer;font-family:inherit;transition:all 0.15s;}

/* Theme dots in settings */

.s-theme-dot.active{border-color:var(--text-title);}
.s-theme-dot::after{content:'';position:absolute;inset:3px;border-radius:50%;}

/* ══════════════════════════════════════
   手機版 RWD（≤ 767px）
   ══════════════════════════════════════ */
@media (max-width: 767px) {

  /* ── 側邊欄：overlay 滑入 ── */
  #sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 200;
    width: 280px !important;
    min-width: 280px !important;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    border-right: 1px solid var(--border) !important;
  }
  #sidebar.mobile-open {
    transform: translateX(0);
  }
  /* 桌面版 collapsed class 在手機無效 */
  #sidebar.collapsed {
    width: 280px !important;
    min-width: 280px !important;
  }

  /* ── 遮罩 ── */
  #sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 199;
  }
  #sidebar-overlay.visible { display: block; }

  /* ── 桌面搜尋框隱藏 ── */
  #search-wrap { display: none; }

  /* ── topbar：加搜尋 icon ── */
  #mobile-search-btn { display: flex; }
  #mobile-search-row { display: none; }
  #mobile-search-row.open {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--sidebar-bg);
  }
  #mobile-search-input {
    flex: 1;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 6px 10px;
    font-size: var(--fs-body);
    color: var(--text-title);
    font-family: inherit;
    outline: none;
  }
  #mobile-search-input:focus { border-color: var(--accent-light); }
  #mobile-search-close {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: var(--fs-subtitle);
    padding: 2px 6px;
  }

  /* ── topbar 調整：隱藏桌面 new-btn 文字，改 icon ── */
  .new-btn { padding: 5px 10px; font-size: var(--fs-btn); }

  /* ── 時間軸卡片：略微收緊 ── */
  .list-cards-wrap { padding: 5px 8px; gap: 5px; }
  .list-card-body { padding: 10px 30px 10px 10px; }
  .list-card-left { width: 52px; padding: 10px 0 10px 10px; }
  .list-card-day { font-size: 22px; }

  /* ── 編輯器：toolbar 收合 ── */
  .ql-toolbar.ql-snow {
    display: none !important;
  }
  .ql-toolbar.ql-snow.toolbar-open {
    display: flex !important;
    flex-wrap: wrap;
  }
  /* Aa 按鈕 */

  /* ── editor topbar 按鈕：在手機上精簡 ── */
  .nav-entry-btn { font-size: 11px; padding: 2px 6px; }
  .del-btn { font-size: 11px; padding: 3px 7px; }

  /* ── action-bar 字型調小 ── */
  .ts-btn, .ai-btn, .analyze-btn { font-size: var(--fs-small); padding: 4px 8px; }
  .word-count { display: none; }
}

}

<script>

// ── GAS 設定 ──
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz3xclRrSiG09WfRAxONhQCJWo9I18OgIQJtpMfOhqA-RekuEswI4d9-IZNQETWzEIAXw/exec';
// v42：暗號不再寫死在程式碼裡（網頁原始碼是公開的），改由使用者在每台裝置輸入一次，存在該裝置的 localStorage
const SECRET_KEY = 'memoire_v10_secret';
function getSecret(){try{return localStorage.getItem(SECRET_KEY)||'';}catch(e){return '';}}

// 實際送出請求（secret 由呼叫端指定，解鎖頁驗證時會帶入「尚未存檔」的候選暗號）
async function rawCallGAS(secret, action, extra={}) {
  const s = encodeURIComponent(secret);
  // writeEntry / gemini 內容可能很長，走 text/plain POST（簡單請求，不觸發 CORS preflight，也沒有網址長度限制；v43 加入 gemini）
  if (action === 'writeEntry' || action === 'gemini' || action === 'saveEntry' || action === 'updateMetaBatch') {  // v46 加入 saveEntry／updateMetaBatch
    const url = `${GAS_URL}?secret=${s}`;
    const r = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action, data: extra})
    });
    return r.json();
  }
  const data = encodeURIComponent(JSON.stringify(extra));
  const url = `${GAS_URL}?secret=${s}&action=${action}&data=${data}`;
  const r = await fetch(url);
  return r.json();
}

async function callGAS(action, extra={}) {
  const secret = getSecret();
  if (!secret) { handleUnauthorized(); return {error:'unauthorized'}; }
  const res = await rawCallGAS(secret, action, extra);
  // 暗號錯誤或已被更換：跳回鎖定頁（回傳值照舊交給呼叫端，存檔流程會照 v41 機制進入待同步，內容不會遺失）
  if (res && res.error === 'unauthorized') handleUnauthorized();
  return res;
}

const TK='memoire_v10_theme';
const APP_VERSION='v47';  // 主程式版本號（v45 起 sw.js 改為 network-first，不必再同步改 CACHE_NAME）
console.log('[Memoire] '+APP_VERSION);
document.addEventListener('DOMContentLoaded',()=>{
  const el=document.getElementById('app-version-label');
  if(el)el.textContent=APP_VERSION;
});
const CACHE_PREFIX='memoire_v10_content_';  // localStorage key prefix for content cache
const INDEX_CACHE_KEY='memoire_v10_index';   // localStorage key for index cache
// ── 版本號（v44：多裝置快取失效）──
// 每次成功存檔產生一個版本號（存檔當下的時間戳記），同時寫進 index（updatedAt）與本機快取（CVER_PREFIX+日期）
// 打開日記時比對兩邊是否「相同」：相同 = 快取是最新的；不同 = 別的裝置改過，改從 Drive 重新下載
// 用「相不相同」而不是比新舊，裝置之間的時鐘誤差不會影響判斷
const CVER_PREFIX='memoire_v10_cver_';
function verStr(v){return v===undefined||v===null?'':String(v);}
function getCacheVer(ds){return lsGet(CVER_PREFIX+ds)||'';}
function setContentCache(ds,body,ver){lsSet(CACHE_PREFIX+ds,body);lsSet(CVER_PREFIX+ds,verStr(ver));}
function delContentCache(ds){lsDel(CACHE_PREFIX+ds);lsDel(CVER_PREFIX+ds);}
// 這篇在本機有尚未上傳的修改：本機版本才是最新的，不可被雲端覆蓋
function isLocalProtected(ds){return !!mdSyncState[ds]||getSyncPending().some(i=>i.date===ds)||getSaving().includes(ds);}
// 記憶體中的內文是否已落後雲端
function isMemoryContentStale(ds){
  const e=entries[ds];
  if(!e||!e.content)return false;
  if(isLocalProtected(ds))return false;
  return verStr(e._cver)!==verStr(e.updatedAt);
}
// 所有 writeIndex 統一用這個組資料，確保版本號（updatedAt）不會被只改 metadata 的路徑洗掉
function buildIndexEntry(ds){
  const e=entries[ds]||{};
  return {
    title:e.title||'',
    preview:getPlain(e.content||'').slice(0,100)||e.preview||'',
    tags:e.tags||[],
    mood:e.mood||'',
    weather:e.weather||'',
    location:e.location||'',
    updatedAt:e.updatedAt||''
  };
}
// index 快取只存 metadata，不存內文（內文另有獨立快取並附版本號；v44 前會把已載入的內文一起存進來，可能讓舊內文復活）
function saveIndexCache(){
  const slim={};
  Object.keys(entries).forEach(ds=>{
    const {content,_cver,_loadFailed,...meta}=entries[ds]||{};
    if(meta._isNew&&!isLocalProtected(ds))return;  // v45：沒打字就離開的新日記不留在快取
    slim[ds]=meta;
  });
  lsSet(INDEX_CACHE_KEY,JSON.stringify(slim));
}

// 設定 key 依裝置分開存
function isMobileDevice(){return window.innerWidth<=767;}
function getSetK(){return isMobileDevice()?'memoire_v10_settings_mobile':'memoire_v10_settings_desktop';}
function getDefaultFontSize(){return isMobileDevice()?'large':'medium';}

let entries={},currentDate=null,quill=null,pendingAIQuestion='';

// ── 自訂分隔線 blot（純視覺橫線，跳脫時間戳記區塊用）──
const BlockEmbed=Quill.import('blots/block/embed');
class DividerBlot extends BlockEmbed{}
DividerBlot.blotName='divider';
DividerBlot.tagName='hr';
Quill.register(DividerBlot);
let calYear=new Date().getFullYear(),calMonth=new Date().getMonth();
let autoSaveTimer=null,sidebarOpen=true;
let pendingSuggestedTags={};
let appSettings={fontSize:getDefaultFontSize(),lineHeight:'normal',aiWriting:true,aiMood:true};
let driveReady=false; // Drive 初始化完成旗標

// ── localStorage helpers（僅用於 theme/settings/content cache）──
function lsGet(key){try{return localStorage.getItem(key);}catch(e){return null;}}
function lsSet(key,val){try{localStorage.setItem(key,val);}catch(e){}}
function lsDel(key){try{localStorage.removeItem(key);}catch(e){}}

// ── Drive 儲存層 ──

// 啟動：從 Drive 讀取 index.json，建立 entries（無 content）
function showLoadingState(msg){
  const page=document.getElementById('list-page');
  if(page)page.innerHTML=`<div class="list-empty"><div style="font-size:28px;opacity:0.3;">⏳</div><div style="font-size:var(--fs-btn);color:var(--text-muted);">${msg}</div></div>`;
}

// prefetched：解鎖頁驗證暗號時已經拿到的 readIndex 結果，直接沿用，不重複呼叫 GAS（v42）
// refresh：true 時是「回到前景」的背景更新，不重新套用本機 index 快取（v44）
let lastIndexLoadAt=0, indexLoading=false;
async function loadEntries(prefetched, refresh){
  if(indexLoading)return;
  indexLoading=true;
  let cached=null;
  try{
    if(!refresh){
      // 先用 localStorage cache 立刻渲染
      cached=lsGet(INDEX_CACHE_KEY);
      if(cached){
        try{
          const raw=JSON.parse(cached);
          // 過濾掉非法 key（必須符合 YYYY-MM-DD）；v44 起不沿用快取裡殘留的內文
          entries=Object.fromEntries(
            Object.entries(raw).filter(([k])=>/^\d{4}-\d{2}-\d{2}$/.test(k))
              .map(([k,v])=>{const {content,_cver,...meta}=v||{};return [k,meta];})
          );
          renderCal();renderEntryList();renderListPage();
        }catch(e){}
      } else {
        showLoadingState('連線中...');
      }
    }
    // 背景從 Drive 拉最新資料
    const res=prefetched||await callGAS('readIndex');
    if(res.error){
      if(!refresh&&!cached)showLoadingState(res.error==='unauthorized'?'請先輸入暗號':'連線失敗，請重新整理');
      return;
    }
    const raw=res.data||{};
    const fresh=Object.fromEntries(
      Object.entries(raw).filter(([k])=>/^\d{4}-\d{2}-\d{2}$/.test(k))
    );
    mergeFreshIndex(fresh);
    driveReady=true;
    lastIndexLoadAt=Date.now();
    saveIndexCache();
    renderCal();renderEntryList();
    if(document.getElementById('list-page').style.display!=='none'&&!currentSearch)renderListPage();
    // 背景預先 cache 最近 20 筆 content（只抓版本不符的）
    prefetchRecentEntries(20);
  }catch(e){
    if(!refresh&&!cached)showLoadingState('網路錯誤，請重新整理');
  }finally{
    indexLoading=false;
  }
}

// 把雲端最新 index 合併進記憶體，而不是整份取代（v44）
// - 正在編輯的那篇：保留本機狀態；若雲端版本不同，交給 handleRemoteChangeForCurrent 處理
// - 有待同步修改的篇目：保留本機版本
// - 其他篇：採用雲端 metadata；記憶體內文版本相同才保留，否則丟掉，下次打開重新下載
// - 本機有、雲端沒有：視為已在其他裝置刪除（正在編輯或待同步的除外）
function mergeFreshIndex(fresh){
  const merged={};
  let remoteChangedCurrent=null;
  Object.keys(fresh).forEach(ds=>{
    const old=entries[ds];
    const nw=Object.assign({},fresh[ds]);
    if(old&&ds===currentDate){
      if(!isLocalProtected(ds)&&verStr(nw.updatedAt)!==verStr(old._cver!==undefined?old._cver:old.updatedAt)){
        remoteChangedCurrent=nw;
      }
      merged[ds]=old;
      return;
    }
    if(old&&isLocalProtected(ds)){merged[ds]=old;return;}
    if(old&&old.content&&verStr(old._cver)===verStr(nw.updatedAt)){
      nw.content=old.content;nw._cver=old._cver;
    }
    merged[ds]=nw;
  });
  Object.keys(entries).forEach(ds=>{
    if(merged[ds])return;
    if(ds===currentDate||isLocalProtected(ds))merged[ds]=entries[ds];
  });
  entries=merged;
  if(remoteChangedCurrent)handleRemoteChangeForCurrent(currentDate,remoteChangedCurrent);
}

// ── 正在編輯的那篇被其他裝置改過（v44）──
// 沒有修改過 → 自動載入雲端版本＋短暫提示；有尚未存檔的修改 → 衝突 banner，選擇前暫停自動存檔
let conflictState=null;  // { ds, remote }
const REFRESH_ICON='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8.1 8.1 0 0 0-15.5-2m-.5-4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>';

function handleRemoteChangeForCurrent(ds,remote){
  if(!ds||ds!==currentDate)return;
  if(conflictState&&conflictState.ds===ds){conflictState.remote=remote;return;}
  if(entries[ds]&&entries[ds]._loadFailed){reloadFromCloud(ds,remote,null);return;}
  if(isEntryDirty(ds)){
    flushCurrentToMemory();
    if(entries[ds])lsSet(CACHE_PREFIX+ds,entries[ds].content||'');  // v46：先存本機
    saveIndexCache();
    handleSaveConflict(ds,remote);
  } else {
    reloadFromCloud(ds,remote,'已載入其他裝置的修改');
  }
}

async function reloadFromCloud(ds,remote,toastMsg){
  clearTimeout(autoSaveTimer);
  delContentCache(ds);
  entries[ds]=Object.assign({},remote,{content:''});
  saveIndexCache();
  if(currentDate!==ds)return;
  await openEntry(ds);  // 同一篇重新開啟：不會觸發離開存檔，內容走懶載入從 Drive 下載
  if(toastMsg&&currentDate===ds)showEditorToast(toastMsg);
}

function showEditorToast(msg){
  const mount=document.getElementById('editor-toast-mount');
  if(!mount)return;
  mount.innerHTML=`<div class="editor-toast-wrap"><div class="editor-toast">${REFRESH_ICON}<span id="editor-toast-text"></span></div></div>`;
  const t=document.getElementById('editor-toast-text');if(t)t.textContent=msg;
  clearTimeout(window._editorToastTimer);
  window._editorToastTimer=setTimeout(()=>{if(mount)mount.innerHTML='';},3000);
}

function renderConflictBanner(){
  const mount=document.getElementById('conflict-banner-mount');
  if(!mount)return;
  mount.innerHTML=`<div class="sync-banner">
    <div class="sync-banner-icon">⚠️</div>
    <div class="sync-banner-body">
      <div class="sync-banner-title">這篇在其他裝置也被修改過</div>
      <div class="sync-banner-desc">你在這台裝置的修改還沒存檔。請選擇要留下哪一個版本，另一個版本的修改會被取代。</div>
      <div class="sync-banner-actions">
        <button class="sync-btn-primary" onclick="resolveConflictKeepMine()">保留我的版本</button>
        <button class="sync-btn-secondary" onclick="resolveConflictLoadCloud()">載入雲端版本</button>
      </div>
    </div>
  </div>`;
}

function clearConflict(ds){
  if(!conflictState)return;
  if(ds&&conflictState.ds!==ds)return;
  conflictState=null;
  const mount=document.getElementById('conflict-banner-mount');
  if(mount)mount.innerHTML='';
  const st=document.getElementById('save-status');
  if(st&&st.textContent==='暫停存檔')setSaveStatus('');
}

// 保留我的版本：以雲端版本為基準立即存檔，用本機內容取代雲端
async function resolveConflictKeepMine(){
  if(!conflictState)return;
  const {ds,remote}=conflictState;
  clearConflict(ds);
  removeSyncPending(ds,'conflict');  // v46
  if(entries[ds])entries[ds].updatedAt=remote?remote.updatedAt:'';  // 雲端已被刪除時以「全新日記」存回
  if(currentDate===ds){setSaveStatus('saving');await doSave();}
  else persistEntry(ds);
}

// 載入雲端版本：二次確認後捨棄本機修改
function resolveConflictLoadCloud(){
  if(!conflictState)return;
  const overlay=document.createElement('div');
  overlay.className='leave-confirm-overlay';
  overlay.id='conflict-confirm-overlay';
  overlay.innerHTML=`<div class="leave-confirm-box">
    <div class="leave-confirm-title">捨棄這台裝置的修改？</div>
    <div class="leave-confirm-desc">${conflictState&&!conflictState.remote?'這篇已在其他裝置刪除。確定後會從這台裝置移除，你在這台裝置的內容將無法復原。':'會改為顯示雲端上的版本，你剛才在這台裝置打的內容將無法復原。'}</div>
    <div class="leave-confirm-actions">
      <button class="leave-confirm-btn-leave" onclick="closeConflictConfirm()">取消</button>
      <button class="leave-confirm-btn-stay" onclick="confirmLoadCloud()">捨棄並載入</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}
function closeConflictConfirm(){const el=document.getElementById('conflict-confirm-overlay');if(el)el.remove();}
async function confirmLoadCloud(){
  closeConflictConfirm();
  if(!conflictState)return;
  const {ds,remote}=conflictState;
  clearConflict(ds);
  removeSyncPending(ds,'conflict');  // v46
  if(!remote){
    // 這篇已在其他裝置刪除：照雲端狀態移除
    delete entries[ds];
    delContentCache(ds);
    saveIndexCache();
    currentDate=null;
    _showListPage();
    return;
  }
  await reloadFromCloud(ds,remote,'已載入雲端版本');
}

// v45：畫面隱藏（切到別的 App、鎖螢幕、關分頁）時立即存檔，不等 1.5 秒
// 不刪除：切出去不代表寫完了（例如全選剪下、切到別的 App 貼上）
function saveNowOnHide(){
  if(loggingOut)return;
  const ds=currentDate;
  if(!ds||!entries[ds]&&!quill)return;
  if(document.getElementById('editor-page').style.display==='none')return;
  if(entries[ds]&&entries[ds]._loadFailed)return;
  if(conflictState&&conflictState.ds===ds){  // v46：衝突期間不存雲端，但先存本機
    clearTimeout(autoSaveTimer);flushCurrentToMemory();
    if(entries[ds])lsSet(CACHE_PREFIX+ds,entries[ds].content||'');
    saveIndexCache();
    return;
  }
  clearTimeout(autoSaveTimer);
  flushCurrentToMemory();
  if(isEntryBlank(ds)){setSaveStatus('');return;}
  if(!isEntryDirty(ds))return;
  persistEntry(ds).then(()=>showSaveResult(ds));  // v46
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNowOnHide();});
window.addEventListener('pagehide',saveNowOnHide);

// 回到前景時，距離上次更新超過 5 分鐘就在背景重抓 index（手機 PWA 常常好幾天不關，切回來時 App 並沒有重新啟動）
const INDEX_REFRESH_MS=5*60*1000;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(!appStarted||!getSecret())return;
  if(Date.now()-lastIndexLoadAt<INDEX_REFRESH_MS)return;
  loadEntries(null,true);
});

// ── Front Matter 讀寫工具（對應 GAS 端 buildFrontMatter/parseFrontMatter，格式須保持一致）──
const FM_FIELDS=['title','tags','mood','weather','location'];

function buildFrontMatter(meta){
  const lines=['---'];
  FM_FIELDS.forEach(f=>{
    let v=meta[f]||'';
    if(f==='tags'&&Array.isArray(v))v=v.join(',');
    lines.push(f+': '+v);
  });
  lines.push('---');
  return lines.join('\n');
}

function parseFrontMatter(raw){
  const empty={title:'',tags:[],mood:'',weather:'',location:''};
  if(!raw||raw.indexOf('---')!==0)return{meta:empty,body:raw||''};
  const lines=raw.split('\n');
  if(lines[0].trim()!=='---')return{meta:empty,body:raw};
  let endIdx=-1;
  for(let i=1;i<lines.length;i++){if(lines[i].trim()==='---'){endIdx=i;break;}}
  if(endIdx===-1)return{meta:empty,body:raw};
  const meta=Object.assign({},empty);
  for(let i=1;i<endIdx;i++){
    const line=lines[i];
    const idx=line.indexOf(':');
    if(idx===-1)continue;
    const key=line.slice(0,idx).trim();
    const val=line.slice(idx+1).trim();
    if(key==='tags'){meta.tags=val?val.split(',').map(s=>s.trim()).filter(Boolean):[];}
    else if(FM_FIELDS.indexOf(key)!==-1){meta[key]=val;}
  }
  let bodyLines=lines.slice(endIdx+1);
  if(bodyLines[0]==='')bodyLines=bodyLines.slice(1);
  return{meta:meta,body:bodyLines.join('\n')};
}

function hasFrontMatter(raw){
  if(!raw||raw.indexOf('---')!==0)return false;
  return parseFrontMatter(raw).body!==raw;
}

// 把解析出的 meta 套回 entries[ds]，loadEntryContent 和 prefetchRecentEntries 共用
function applyMetaToEntry(ds,meta){
  if(!entries[ds])return;
  entries[ds].title=meta.title;
  entries[ds].tags=meta.tags;
  entries[ds].mood=meta.mood;
  entries[ds].weather=meta.weather;
  entries[ds].location=meta.location;
}

// 背景逐筆抓取最近 N 筆；v44：快取存在「且版本相同」才跳過，別的裝置改過的會重新下載
async function prefetchRecentEntries(n){
  const sorted=Object.keys(entries).sort((a,b)=>b.localeCompare(a)).slice(0,n);
  for(const ds of sorted){
    if(ds===currentDate||isLocalProtected(ds))continue;
    if(lsGet(CACHE_PREFIX+ds)!==null&&getCacheVer(ds)===verStr(entries[ds]&&entries[ds].updatedAt))continue;
    try{
      const res=await callGAS('readEntry',{date:ds});
      if(!res||res.error)continue;
      const raw=res.content||'';
      const{meta,body}=parseFrontMatter(raw);
      if(!entries[ds]||ds===currentDate)continue;
      if(hasFrontMatter(raw))applyMetaToEntry(ds,meta);
      setContentCache(ds,body,entries[ds].updatedAt);
      if(entries[ds].content!==undefined){entries[ds].content=body;entries[ds]._cver=entries[ds].updatedAt;}
      // 每筆間隔 300ms，避免 GAS 過載
      await new Promise(r=>setTimeout(r,300));
    }catch(e){}
  }
}

// 儲存單筆日記到 Drive（.md + index 單筆 merge）
// ── 資料層：三個明確分工的函數 ──

// ── isDirty 判斷工具（v40 新增）──
// 記錄「進入編輯器當下」六個欄位的快照，離開時用來判斷有沒有真的變動過
// 避免 goBack()/openEntry() 無條件存檔覆蓋正確資料（2021-07-17 事故根因）
let entrySnapshotDate=null, entrySnapshot=null;

function fieldsSnapshot(ds){
  const e=entries[ds];
  if(!e)return null;
  return JSON.stringify({
    title:e.title||'',
    content:quill?quill.root.innerHTML:(e.content||''), // 讀 quill 現況而非 e.content，避開 dangerouslyPasteHTML 對 HTML 的正常化差異
    tags:e.tags||[],
    mood:e.mood||'',
    weather:e.weather||'',
    location:e.location||''
  });
}

// 進入一篇日記、內容已完整載入時呼叫，記下當下狀態當基準
function captureSnapshot(ds){
  entrySnapshotDate=ds;
  entrySnapshot=fieldsSnapshot(ds);
}

// 判斷離開時，這篇日記是否真的跟「進入當下」不一樣
// 找不到對應快照時保守回傳 true（寧可多存，不要漏存）
function isEntryDirty(ds){
  if(entries[ds]&&entries[ds]._loadFailed)return false;  // v44
  if(entrySnapshotDate!==ds)return true;
  return fieldsSnapshot(ds)!==entrySnapshot;
}

// v45：在本機建立一篇「還沒存進雲端過」的日記（_isNew）
// 這種日記的天氣、地點、心情只放記憶體，不寫雲端 index；第一次成功存檔時才和內文一起寫入，避免留下空白卡片
function ensureLocalEntry(ds){
  if(!entries[ds])entries[ds]={title:'',content:'',tags:[],mood:'',weather:'',location:'',_isNew:true};
  return entries[ds];
}

// 1. 把 DOM 當前值同步進 entries memory（純同步，不 async，不碰 GAS）
function flushCurrentToMemory(){
  if(!currentDate)return;
  if(entries[currentDate]&&entries[currentDate]._loadFailed)return;  // v44：載入失敗時畫面是空的，不可寫回記憶體
  ensureLocalEntry(currentDate);
  const ti=document.getElementById('title-input');
  if(ti)entries[currentDate].title=ti.value;
  if(quill)entries[currentDate].content=quill.root.innerHTML;
}

// ── 同步失敗追蹤（v41：存檔時序改造，md 優先序）──
// mdSyncState：ds -> 'retrying' | 'failed'（存在即代表尚未成功同步，不存在視為 ok，只存於記憶體）
// syncPending：localStorage 持久化清單，跨頁面/重新整理後仍能顯示 banner 與卡片標記
const SYNC_PENDING_KEY='memoire_v10_sync_pending';
let mdSyncState={};

// v45：「存檔中」標記——存檔一開始就記下，雲端成功或轉為待同步時刪除
// App 在存檔途中被關掉時，下次開啟會把它轉成「待同步」（沿用 v41 banner 與重試）
const SAVING_KEY='memoire_v10_saving';
function getSaving(){try{return JSON.parse(lsGet(SAVING_KEY)||'[]');}catch(e){return [];}}
function markSaving(ds){const l=getSaving();if(!l.includes(ds)){l.push(ds);lsSet(SAVING_KEY,JSON.stringify(l));}}
function unmarkSaving(ds){lsSet(SAVING_KEY,JSON.stringify(getSaving().filter(d=>d!==ds)));}

function getSyncPending(){try{return JSON.parse(lsGet(SYNC_PENDING_KEY)||'[]');}catch(e){return [];}}
function setSyncPending(list){lsSet(SYNC_PENDING_KEY,JSON.stringify(list));}
// type：'md'（雲端存檔失敗，可重試）／'conflict'（v46：雲端已被其他裝置修改，需要使用者選擇保留哪個版本；remote = 雲端當時的資料）
function addSyncPending(date,type,remote){
  const list=getSyncPending();
  const ex=list.find(i=>i.date===date&&i.type===type);
  if(ex){if(remote!==undefined)ex.remote=remote;}
  else list.push({date,type,failedAt:Date.now(),remote:remote===undefined?undefined:remote});
  setSyncPending(list);
  renderSyncUI();
}
function getPendingConflict(ds){return getSyncPending().find(i=>i.date===ds&&i.type==='conflict')||null;}
function removeSyncPending(date,type){
  const list=getSyncPending().filter(i=>!(i.date===date&&i.type===type));
  setSyncPending(list);
  renderSyncUI();
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

// 統一觸發三處會顯示同步狀態的地方：banner、卡片小標記、設定頁清單
function renderSyncUI(){
  renderSyncBanner();
  if(document.getElementById('list-page')&&document.getElementById('list-page').style.display!=='none')renderListPage();
  renderSyncPendingSettings();
}

function renderSyncBanner(){

  const list=getSyncPending().filter(i=>!(i.type==='conflict'&&i.date===currentDate));
  if(!list.length){mount.innerHTML='';return;}
  // 只顯示最近一筆，避免同時堆疊多條 banner；其餘篇目由卡片小標記與設定頁清單涵蓋

      <div class="sync-banner-actions">
        <button class="sync-btn-primary" onclick="openEntry('${item.date}')">打開處理</button>
        <button class="sync-btn-secondary" onclick="dismissSyncBanner()">知道了，稍後處理</button>
      </div>
    </div>
  </div>`;

  }
  mount.innerHTML=`<div class="sync-banner">
    <div class="sync-banner-icon">⚠️</div>
    <div class="sync-banner-body">
      <div class="sync-banner-title">${md} 的日記尚未同步到雲端</div>
      <div class="sync-banner-desc">目前只存在這台裝置，請檢查網路後重試。</div>
      <div class="sync-banner-actions">
        <button class="sync-btn-primary" onclick="retrySync('${item.date}')">立即重試</button>
        <button class="sync-btn-secondary" onclick="dismissSyncBanner()">知道了，稍後處理</button>
      </div>
    </div>
  </div>`;
}
function dismissSyncBanner(){
  const mount=document.getElementById('sync-banner-mount');
  if(mount)mount.innerHTML='';
}

function renderSyncPendingSettings(){
  const row=document.getElementById('sync-pending-row');
  const listEl=document.getElementById('sync-pending-list');
  if(!row||!listEl)return;
  const list=getSyncPending();
  if(!list.length){row.style.display='none';listEl.innerHTML='';return;}
  row.style.display='flex';
  listEl.innerHTML=list.map(i=>i.type==='conflict'?`
    <div class="sync-settings-item">

      <button class="settings-action-btn" onclick="openEntry('${i.date}')">打開處理</button>
    </div>`:`
    <div class="sync-settings-item">
      <span class="sync-settings-item-label">${i.date}（${i.type==='md'?'內容':'索引'}）</span>
      <button class="settings-action-btn" onclick="retrySync('${i.date}')">重試</button>
    </div>`).join('');
}

// 手動重試：確保內容已載入記憶體後，重新跑一次完整 persistEntry（md → index）
async function retrySync(ds){
  if(!entries[ds])return;
  if(getPendingConflict(ds)){openEntry(ds);return;}  // v46：衝突不能直接重試，要打開讓使用者選擇
  if(!entries[ds].content){
    entries[ds].content=await loadEntryContent(ds);
  }
  await persistEntry(ds);
}
async function retryAllSyncPending(){
  const dates=[...new Set(getSyncPending().filter(i=>i.type==='md').map(i=>i.date))];  // v46：衝突項目不自動重試
  for(const ds of dates){await retrySync(ds);}
}

// 離開頁面前的確認視窗：只在該篇目前處於「重試中」或「已失敗」狀態時觸發
let _leaveConfirmResolver=null;
function confirmLeaveIfSyncFailed(ds){
  if(!ds)return Promise.resolve(true);
  const st=mdSyncState[ds];
  if(st!=='retrying'&&st!=='failed')return Promise.resolve(true);
  const overlay=document.createElement('div');
  overlay.className='leave-confirm-overlay';
  overlay.id='leave-confirm-overlay';
  overlay.innerHTML=`<div class="leave-confirm-box">
    <div class="leave-confirm-icon">⚠️</div>
    <div class="leave-confirm-title">這篇日記還沒有成功同步到雲端</div>
    <div class="leave-confirm-desc">目前內容只存在這台裝置。如果現在離開，系統會持續在背景重試，你也可以之後在設定頁手動重試。</div>
    <div class="leave-confirm-actions">
      <button class="leave-confirm-btn-stay" onclick="resolveLeaveConfirm(false)">留下繼續處理</button>
      <button class="leave-confirm-btn-leave" onclick="resolveLeaveConfirm(true)">仍要離開</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  return new Promise(resolve=>{_leaveConfirmResolver=resolve;});
}
function resolveLeaveConfirm(leave){
  const el=document.getElementById('leave-confirm-overlay');
  if(el)el.remove();
  if(_leaveConfirmResolver){_leaveConfirmResolver(leave);_leaveConfirmResolver=null;}
}

// v46：存檔（.md＋index 由 GAS 在同一把鎖裡寫入）＋重試（固定間隔 3 秒，最多重試 2 次）
// 回傳 {ok, updatedAt}／{conflict, remote}／{failed}
// 重試時帶同一個 saveId：雲端其實已經存好、只是沒收到回應時，GAS 會當成成功，不會誤判為衝突
async function persistSaveWithRetry(ds,payload){
  for(let attempt=0;attempt<=2;attempt++){
    if(attempt>0){
      mdSyncState[ds]='retrying';
      renderSyncUI();
      await sleep(3000);
    }
    let res=null;
    try{res=await callGAS('saveEntry',payload);}catch(e){res=null;}
    if(res&&res.ok){
      delete mdSyncState[ds];
      removeSyncPending(ds,'md');
      return {ok:true,updatedAt:res.updatedAt};
    }
    if(res&&res.conflict){
      delete mdSyncState[ds];
      removeSyncPending(ds,'md');
      return {conflict:true,remote:res.remote||null};
    }
  }
  mdSyncState[ds]='failed';
  addSyncPending(ds,'md');
  return {failed:true};
}

// v46：存檔時 GAS 回報「雲端已被其他裝置修改」
// 本機內容已在存檔一開始寫進快取；記成待同步「衝突」保護它不被雲端覆蓋，並請使用者選擇保留哪個版本
function handleSaveConflict(ds,remote){
  addSyncPending(ds,'conflict',remote);
  if(currentDate===ds){
    conflictState={ds,remote};
    renderConflictBanner();
    setSaveStatus('paused');
    renderSyncBanner();
  }
}

// 打開一篇有待處理衝突的日記時，顯示衝突 banner
function showPendingConflict(ds){
  const pc=getPendingConflict(ds);
  if(!pc||currentDate!==ds)return;
  conflictState={ds,remote:pc.remote||null};
  renderConflictBanner();
  setSaveStatus('paused');
  renderSyncBanner();
}

// 2. 把 entries[ds] 寫進 localStorage + GAS（純 async，完全不碰 DOM 或全域 currentDate）
// .md 是 title/tags/mood/weather/location 的正本：寫入前用 front matter 把這些欄位附加在內文最前面
// v41：md 優先序——md 寫入（含重試）成功後才寫 index，取代原本的 Promise.all 平行送出
// v45：每篇日記排一個隊，同時只允許一個存檔請求
// 存檔進行中又有新修改 → 只記「還要再存一次」，前一個完成後用當下最新內容再存（多次修改合併成一次）
const saveQueue={};
function persistEntry(ds){
  if(!ds)return Promise.resolve();
  const q=saveQueue[ds];
  if(q){q.again=true;return q.done;}
  const nq={again:false};
  saveQueue[ds]=nq;
  nq.done=(async()=>{
    try{
      do{nq.again=false;await persistEntryOnce(ds);}while(nq.again);
    }finally{delete saveQueue[ds];}
  })();
  return nq.done;
}

// 實際存一次（v45：內容空白時不存也不刪；刪除只在離開這篇時由 leaveCurrentEntry 處理）
async function persistEntryOnce(ds){
  if(!ds||!entries[ds])return;
  if(entries[ds]._loadFailed)return;  // v44：內容沒載入成功，絕不寫入
  if(conflictState&&conflictState.ds===ds)return;  // v44：衝突 banner 顯示中，等使用者選擇
  const e=entries[ds];
  const plain=getPlain(e.content||'');
  if(!e.title?.trim()&&!plain.trim())return;  // v45：空白不存、不刪
  const meta={
    title:e.title||'',
    tags:e.tags||[],
    mood:e.mood||'',
    weather:e.weather||'',
    location:e.location||''
  };
  const content=e.content||'';
  const fullContent=buildFrontMatter(meta)+'\n\n'+content;
  const indexEntry=buildIndexEntry(ds);
  delete indexEntry.updatedAt;  // v46：版本號由 GAS 產生
  const saveId=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  // v45：先寫本機（版本號維持舊的）＋記「存檔中」，App 在送雲端途中被關掉也不會遺失
  lsSet(CACHE_PREFIX+ds,content);
  markSaving(ds);
  const result=await persistSaveWithRetry(ds,{date:ds,content:fullContent,entry:indexEntry,baseVersion:verStr(e.updatedAt),saveId});
  unmarkSaving(ds);  // 成功 → 不再需要；失敗 → 已轉成待同步；衝突 → 下一行轉成衝突
  if(result.conflict){handleSaveConflict(ds,result.remote);return;}
  if(!result.ok){
    // 沒同步成功：不更新 dirty 快照基準，讓下次離開這篇時仍判定為 dirty、有機會再次觸發存檔
    return;
  }
  if(!entries[ds])return;  // 存檔期間這篇被刪除
  // 成功：記憶體、本機快取換成 GAS 回傳的新版本號（index 已由 GAS 在同一次請求寫好）
  e.updatedAt=result.updatedAt;
  e._cver=result.updatedAt;
  delete e._isNew;  // v45：已存進雲端
  delete e._pendingMeta;
  setContentCache(ds,content,result.updatedAt);
  if(e.content!==content)lsSet(CACHE_PREFIX+ds,e.content||'');  // 存檔期間又有新修改：本機快取保留最新內容（下一輪會再存）
  saveIndexCache();
  // 只在還停留在同一篇、且畫面內容就是剛存進去的內容時更新基準（v45：存檔期間又打字的話保持 dirty，離開時才會再存）
  const savedSnap=JSON.stringify({title:meta.title,content,tags:meta.tags,mood:meta.mood,weather:meta.weather,location:meta.location});
  if(currentDate===ds&&fieldsSnapshot(ds)===savedSnap){entrySnapshotDate=ds;entrySnapshot=savedSnap;}
}

// v46：存檔結束後依實際結果顯示狀態（衝突 → 暫停存檔；失敗 → 清空，由待同步 banner 說明；成功才顯示「已儲存」）
function showSaveResult(ds){
  if(currentDate!==ds)return;
  if(conflictState&&conflictState.ds===ds){setSaveStatus('paused');return;}
  if(mdSyncState[ds]){setSaveStatus('');return;}
  setSaveStatus('saved');renderEntryList();renderCal();
  setTimeout(()=>{const el=document.getElementById('save-status');if(el&&el.textContent==='已儲存')setSaveStatus('');},2500);
}

function isEntryBlank(ds){
  const e=entries[ds];
  return !e||(!e.title?.trim()&&!getPlain(e.content||'').trim());
}

// 3. 相容舊呼叫 saveEntries()
async function saveEntries(ds){
  await persistEntry(ds||currentDate);
}

// 讀取單筆日記 content（有 cache 直接用，否則從 Drive 抓）
// 讀到內容後先解析 front matter：剝離後的乾淨內文才回傳/存進 cache，meta 同步覆蓋回 entries[ds]
// 連 cache 命中的情況也一併檢查，可自動修好舊版程式殘留的髒 cache
// v44：快取版本與 index 版本相同（或本機有待同步修改）才用快取，否則從 Drive 重新下載
// 回傳 null 代表載入失敗（呼叫端不可把它當成「空白日記」，否則使用者一打字就會用空內容蓋掉雲端正本）
async function loadEntryContent(ds){
  const idxVer=verStr(entries[ds]&&entries[ds].updatedAt);
  const cached=lsGet(CACHE_PREFIX+ds);
  if(cached!==null&&(isLocalProtected(ds)||getCacheVer(ds)===idxVer)){
    if(entries[ds])entries[ds]._cver=getCacheVer(ds);
    if(hasFrontMatter(cached)){
      const{meta,body}=parseFrontMatter(cached);
      applyMetaToEntry(ds,meta);
      setContentCache(ds,body,getCacheVer(ds));
      return body;
    }
    return cached;
  }
  // 沒有快取或版本不符，從 Drive 抓
  try{
    const res=await callGAS('readEntry',{date:ds});
    if(!res||res.error)return null;
    const raw=res.content||'';
    const{meta,body}=parseFrontMatter(raw);
    if(hasFrontMatter(raw))applyMetaToEntry(ds,meta);
    setContentCache(ds,body,idxVer);
    if(entries[ds])entries[ds]._cver=idxVer;
    return body;
  }catch(e){return null;}
}

function fmtDisplay(ds){const d=new Date(ds+'T12:00:00');const dw=['日','一','二','三','四','五','六'];return d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日（'+dw[d.getDay()]+'）';}

// ── v47：文字安全顯示 ──
// 使用者輸入的文字（標題、標籤、地點、心情、預覽、搜尋字詞）放進畫面前一律先 esc()，只當文字顯示
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// 把 &amp; &nbsp; &lt; 等網頁碼轉回真正的文字（textarea 只解碼、不執行任何東西）
const _decodeEl=document.createElement('textarea');
function decodeEntities(s){if(!s||s.indexOf('&')===-1)return s||'';_decodeEl.innerHTML=s;return _decodeEl.value;}
// 內文 HTML → 純文字（v47：網頁碼轉回真正的文字；畫面顯示時再 esc）
function getPlain(html){return decodeEntities((html||'').replace(/<[^>]+>/g,' ')).replace(/\s+/g,' ').trim();}
// 卡片預覽用：內文沒載入時用 index 上的 preview（preview 已是純文字，不再去標籤；舊資料可能含網頁碼，一起轉回）
function plainOf(e){return getPlain(e.content)||decodeEntities(e.preview||'').replace(/\s+/g,' ').trim();}
// 標籤名稱檢查：.md 的 front matter 用逗號分隔標籤，名稱有逗號會被拆成兩個
function tagNameError(t){return /[,，]/.test(t)?'標籤名稱不能有逗號（, 或 ，）':'';}
// 搜尋結果高亮：先切出符合的片段，每段各自 esc，不會把網頁碼切壞
function highlightEsc(text,keywords){
  if(!text)return '';
  const ks=(keywords||[]).filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!ks.length)return esc(text);
  const re=new RegExp(ks.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'gi');
  let out='',last=0,m;
  while((m=re.exec(text))){
    if(!m[0]){re.lastIndex++;continue;}
    out+=esc(text.slice(last,m.index))+'<span class="search-highlight">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(text.slice(last));
}

function renderCal(){
  const grid=document.getElementById('cal-grid');
  const yearSel=document.getElementById('cal-year-select');
  const monthSel=document.getElementById('cal-month-select');
  if(!grid||!yearSel||!monthSel)return;

  // 動態年份範圍：最早日記年份 → 今年
  const thisYear=new Date().getFullYear();
  const allYears=Object.keys(entries).map(ds=>parseInt(ds.slice(0,4)));
  const minYear=allYears.length?Math.min(...allYears):thisYear;
  // 重建 year options（只在選項不符時才重建，避免閃爍）
  const yearOptions=[];
  for(let y=minYear;y<=thisYear;y++)yearOptions.push(y);
  if(yearSel.options.length!==yearOptions.length||parseInt(yearSel.options[0]?.value)!==minYear){
    yearSel.innerHTML=yearOptions.map(y=>`<option value="${y}"${y===calYear?' selected':''}>${y}</option>`).join('');
  } else {
    yearSel.value=calYear;
  }

  // 月份 options
  const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  if(monthSel.options.length!==12){
    monthSel.innerHTML=monthNames.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
  }
  monthSel.value=calMonth;

  // 日曆格子
  const dows=['日','一','二','三','四','五','六'];
  let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first=new Date(calYear,calMonth,1).getDay(),dim=new Date(calYear,calMonth+1,0).getDate(),prev=new Date(calYear,calMonth,0).getDate(),today=todayStr();
  for(let i=0;i<first;i++){const day=prev-first+1+i;const m=calMonth===0?12:calMonth;const y=calMonth===0?calYear-1:calYear;html+=`<div class="cal-day other-month" onclick="selectDate('${y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0')}')">${day}</div>`;}
  for(let d=1;d<=dim;d++){const ds=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');let cls='cal-day';if(ds===today)cls+=' today';if(ds===currentDate)cls+=' selected';if(entries[ds])cls+=' has-entry';html+=`<div class="${cls}" onclick="selectDate('${ds}')">${d}</div>`;}
  // 補足 42 格（6列×7欄），確保日曆高度固定
  const total=first+dim;const remain=42-total;
  const nm=calMonth===11?1:calMonth+2;const ny=calMonth===11?calYear+1:calYear;
  for(let d=1;d<=remain;d++){const ds=ny+'-'+String(nm).padStart(2,'0')+'-'+String(d).padStart(2,'0');html+=`<div class="cal-day other-month" onclick="selectDate('${ds}')">${d}</div>`;}
  grid.innerHTML=html;
}

const CARD_PIN_SVG='<svg width="8" height="11" viewBox="0 0 10 14" fill="none" style="display:inline;vertical-align:middle;margin-right:2px;"><path d="M5 0C2.24 0 0 2.24 0 5C0 8.75 5 14 5 14C5 14 10 8.75 10 5C10 2.24 7.76 0 5 0ZM5 6.5C4.17 6.5 3.5 5.83 3.5 5C3.5 4.17 4.17 3.5 5 3.5C5.83 3.5 6.5 4.17 6.5 5C6.5 5.83 5.83 6.5 5 6.5Z" fill="var(--accent-light)"/></svg>';

    :pending.some(i=>i.date===ds&&i.type==='md')
    ?`<span class="sync-badge" title="點擊查看同步狀態" onclick="event.stopPropagation();retrySync('${ds}')"><span class="sync-badge-dot"></span>未同步</span>`
    :'';
  return `<div class="list-card" onclick="openEntry('${ds}')">
        <div class="list-card-left">

// v45：統一的「離開目前這篇」流程——返回、切換篇目、切到設定／標籤／今日回顧／搜尋都走這裡
// 回傳 false 代表使用者選擇留下（同步失敗確認視窗）；成功離開後 currentDate 會被清成 null
async function leaveCurrentEntry(){
  const ds=currentDate;
  if(!ds)return true;
  clearTimeout(autoSaveTimer);
  if(window._geoFallbackTimer){clearTimeout(window._geoFallbackTimer);window._geoFallbackTimer=null;}
  if(!(await confirmLeaveIfSyncFailed(ds)))return false; // 使用者選擇留下繼續處理
  if(currentDate!==ds)return true;  // 確認視窗期間已被其他流程切走
  clearConflict(ds);  // v44：沒做選擇就離開 = 保留本機版本
  if(entries[ds]&&entries[ds]._loadFailed){  // v44：內容沒載入成功，不存檔也不判斷空白刪除
    delete entries[ds]._loadFailed;
    currentDate=null;
    return true;
  }
  flushCurrentToMemory();
  if(getPendingConflict(ds)){  // v46：衝突還沒處理：內容留在本機，不刪除也不送雲端
    if(entries[ds])lsSet(CACHE_PREFIX+ds,entries[ds].content||'');
    saveIndexCache();
    currentDate=null;
    renderSyncUI();
    return true;
  }
  currentDate=null;
  if(isEntryBlank(ds)){
    // 標題和內文都空：刪除（還沒存進雲端過的新日記只刪本機，不送刪除請求）
    const wasNew=!!(entries[ds]&&entries[ds]._isNew);
    delete entries[ds];
    delContentCache(ds);
    saveIndexCache();
    if(!wasNew)callGAS('deleteEntry',{date:ds});
  } else if(isEntryDirty(ds)){
    persistEntry(ds);  // 背景存檔，不等待
  }
  return true;
}

async function openEntry(ds){
  clearTimeout(autoSaveTimer);
  const prevDate=currentDate;
  if(prevDate&&prevDate!==ds){
    if(!(await leaveCurrentEntry()))return;  // v45：統一離開流程（存檔、空白刪除、衝突、同步失敗確認）
  }
  currentDate=ds;calYear=parseInt(ds.slice(0,4));calMonth=parseInt(ds.slice(5,7))-1;
  // v44：記憶體中的內文若已落後雲端版本，丟掉改走懶載入重新下載
  if(entries[ds]&&isMemoryContentStale(ds))entries[ds].content='';
  // 若 content 尚未載入（lazy load）
  if(entries[ds]&&!entries[ds].content){
    showEditorPage();
    buildEditor(entries[ds]);  // 先顯示 UI（title/tags 已有）
    // 顯示 loading overlay
    const mount=document.getElementById('quill-mount');
    const overlay=document.createElement('div');
    overlay.className='editor-loading';
    overlay.innerHTML='<div class="editor-loading-spinner"></div><div class="editor-loading-text">載入中...</div>';
    if(mount)mount.appendChild(overlay);
    const content=await loadEntryContent(ds);
    if(currentDate===ds&&content===null&&entries[ds]){
      // v44：載入失敗——保留遮罩、禁止編輯並標記，離開時不存檔也不刪除，避免用空內容蓋掉雲端正本
      entries[ds]._loadFailed=true;
      const t=overlay.querySelector('.editor-loading-text');
      const sp=overlay.querySelector('.editor-loading-spinner');
      if(sp)sp.remove();
      if(t)t.textContent='內容載入失敗，請檢查網路後返回重新開啟';
    } else if(currentDate===ds&&entries[ds]){  // 確認還在同一篇
      delete entries[ds]._loadFailed;
      entries[ds].content=content;
      if(quill){
        // 先拔掉監聽器再貼內容，避免這次程式化貼入被誤判成使用者打字、觸發自動存檔（v40）
        quill.off('text-change',onInput);
        quill.clipboard.dangerouslyPasteHTML(content);
        quill.on('text-change',onInput);
      }
      overlay.remove();
      captureSnapshot(ds);  // 內容補齊後才拍快照，避免誤判成內文變動（v40）
      updateWordCount();    // v44：懶載入後重算字數（原本會顯示 0 字）
      showPendingConflict(ds);  // v46
      flushPendingMeta(ds);     // v46
    }
  } else {
    showEditorPage();buildEditor(entries[ds]||{});
    captureSnapshot(ds);  // v40
    showPendingConflict(ds);  // v46
    flushPendingMeta(ds);     // v46
  }
  renderCal();renderEntryList();
}

  // 最終 DOM：

  //         .ql-container

  const dateMeta=document.createElement('div');
  dateMeta.id='date-meta-wrap';
  const dateRow=document.createElement('div');

  if(festival) dateHtml+=`<span class="date-dot">·</span><span class="date-festival">${festival}</span>`;
  else if(jieqi) dateHtml+=`<span class="date-dot">·</span><span class="date-jieqi">${jieqi}</span>`;

  dateMeta.appendChild(dateRow);
  const wlRow=document.createElement('div');
  wlRow.id='weather-location-row';
  dateMeta.appendChild(wlRow);
  mount.appendChild(dateMeta);

  // 2. 再建暫存 div 給 Quill 初始化（toolbar 自動插在 tempDiv 之前，即 dateMeta 之後）
  const tempDiv=document.createElement('div');
  mount.appendChild(tempDiv);

  quill=new Quill(tempDiv,{
    theme:'snow',
    placeholder:'今天想寫什麼...',
    modules:{toolbar:{
      container:[
        ['bold','italic','underline'],
        [{header:2}],
        ['highlight'],
        [{list:'ordered'},{list:'bullet'},'blockquote'],
        ['code-block','divider'],
        ['clean']
      ],

        divider:function(){
          const range=this.quill.getSelection(true);
          const pos=range?range.index:this.quill.getLength();
          this.quill.insertEmbed(pos,'divider',true,'user');
          this.quill.insertText(pos+1,'\n','user');
          this.quill.setSelection(pos+2,0);
        },
        highlight:function(){
          toggleHighlightPalette(this.quill,document.querySelector('.ql-highlight'));
        }
      }
    }}
  });
  // highlight / divider 按鈕內容（Quill 不認得自訂格式名，圖示需手動補）
  const hlBtn=document.querySelector('.ql-highlight');
  if(hlBtn){
    hlBtn.innerHTML='<svg viewBox="0 0 18 18"><path class="ql-stroke" d="M7.5 12.5 3 17H1v-2l4.5-4.5"/><path class="ql-stroke" d="M6 11l5-5 3 3-5 5z"/><path class="ql-stroke" style="fill:none;" d="M11 6l2.5-2.5a1.5 1.5 0 0 1 2 2L13 8"/></svg><span class="ql-hl-bar"></span>';
  }
  const divBtn=document.querySelector('.ql-divider');
  if(divBtn){
    divBtn.innerHTML='<svg viewBox="0 0 18 18"><line class="ql-stroke" x1="2" y1="9" x2="16" y2="9"/></svg>';
  }
  // 現在 mount 結構：.ql-toolbar（Quill 插到 tempDiv 前面）/ tempDiv(.ql-container)

  // 3. 建 editor-body，把 title + ql-container 放進去
  const editorBody=document.createElement('div');
  editorBody.id='editor-body';

  const titleEl=document.createElement('input');
  titleEl.id='title-input';
  titleEl.placeholder='標題（選填）';
  titleEl.autocomplete='off';
  titleEl.value=e.title||'';
  titleEl.addEventListener('input',onInput);
  editorBody.appendChild(titleEl);

  // 把 ql-container（即 tempDiv，現在已變成 .ql-container）移進 editorBody
  const qlContainer=mount.querySelector('.ql-container');
  editorBody.appendChild(qlContainer);

  mount.appendChild(editorBody);
  renderTagsRow(e.tags||[], pendingSuggestedTags[currentDate]||[]);

  if(e.content)quill.clipboard.dangerouslyPasteHTML(e.content);  // content 可能在 lazy load 後才填入
  quill.on('text-change',onInput);
  // IME 組字時隱藏 placeholder，避免畫面重疊
  quill.root.addEventListener('compositionstart',()=>quill.root.classList.add('ime-composing'));
  quill.root.addEventListener('compositionend',()=>quill.root.classList.remove('ime-composing'));
  renderWeatherLocation(e);
  renderOtd();
  updateWordCount();
  updateNavButtons();
}

const FIXED_HOLIDAYS={
  '01-01':'元旦','02-28':'和平紀念日','04-04':'兒童節',
  '05-01':'勞動節','09-28':'教師節','10-10':'國慶日','12-25':'聖誕節',
};

function getDateInfo(ds){
  if(!ds)return{festival:null,jieqi:null};
  const year=parseInt(ds.slice(0,4));
  const mmdd=ds.slice(5); // MM-DD
  const yearIdx=year-2024;

  // 1. 固定國定假日
  if(FIXED_HOLIDAYS[mmdd])return{festival:FIXED_HOLIDAYS[mmdd],jieqi:null};

  // 2. 農曆節日（查對照表，2024–2032）
  if(yearIdx>=0&&yearIdx<=8){
    for(const [name,dates] of Object.entries(LUNAR_FESTIVALS)){
      if(dates[yearIdx]===ds)return{festival:name,jieqi:null};
    }
  }

  // 3. 二十四節氣（查對照表，2024–2032）
  if(yearIdx>=0&&yearIdx<=8){
    for(const [name,dates] of Object.entries(JIEQI_TABLE)){
      if(dates[yearIdx]===ds)return{festival:null,jieqi:name};
    }
  }

  return{festival:null,jieqi:null};
}

const PIN_SVG=`<span class="pin-svg"><svg width="9" height="13" viewBox="0 0 10 14" fill="none"><path d="M5 0C2.24 0 0 2.24 0 5C0 8.75 5 14 5 14C5 14 10 8.75 10 5C10 2.24 7.76 0 5 0ZM5 6.5C4.17 6.5 3.5 5.83 3.5 5C3.5 4.17 4.17 3.5 5 3.5C5.83 3.5 6.5 4.17 6.5 5C6.5 5.83 5.83 6.5 5 6.5Z" fill="var(--accent-light)"/></svg></span>`;

function renderWeatherLocation(e){
  const row=document.getElementById('weather-location-row');
  if(!row)return;
  const isToday=(currentDate===todayStr());

  // 已有儲存的天氣地點資料直接顯示
  if(e.weather||e.location){
    renderWLRow(row,e.weather||null,e.location||null);
    return;
  }
  // 只有今天才自動抓取
  if(!isToday){row.innerHTML='';return;}

  // 顯示載入中
  row.innerHTML=`<span class="wl-loading">取得天氣中...</span><span class="wl-divider" style="margin:0 2px;"></span><span class="wl-loading">定位中...</span>`;

  let geoSettled=false;
  // Hard fallback：1 秒內 geolocation 沒回應，直接用台北座標
  const capturedDate=currentDate;
  if(!capturedDate||!/^\d{4}-\d{2}-\d{2}$/.test(capturedDate))return;

  // 確保 entry 存在（新日記尚未儲存時也能寫入 weather）
  function ensureEntry(ds){ensureLocalEntry(ds);}  // v45

  window._geoFallbackTimer=setTimeout(async()=>{
    if(geoSettled)return;
    geoSettled=true;
    window._geoFallbackTimer=null;
    const weather=await fetchWeather(25.033,121.565);
    if(weather&&capturedDate){
      ensureEntry(capturedDate);
      entries[capturedDate].weather=weather;
      saveMetaChange(capturedDate);
      if(currentDate===capturedDate){
        const r=document.getElementById('weather-location-row');
        if(r)renderWLRow(r,weather,entries[capturedDate].location||null,!entries[capturedDate].location);
      }
    }
  },1000);
  const settle=()=>{geoSettled=true;clearTimeout(window._geoFallbackTimer);window._geoFallbackTimer=null;};

  // 嘗試定位
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      async pos=>{
        if(geoSettled)return;
        settle();
        const lat=pos.coords.latitude,lon=pos.coords.longitude;
        const [weather,location]=await Promise.all([
          fetchWeather(lat,lon),
          fetchLocation(lat,lon)
        ]);
        if(capturedDate){
          ensureEntry(capturedDate);
          if(weather)entries[capturedDate].weather=weather;
          if(location)entries[capturedDate].location=location;
          saveMetaChange(capturedDate);
        }
        if(currentDate===capturedDate){
          const r=document.getElementById('weather-location-row');
          if(r)renderWLRow(r,weather,location);
        }
      },
      async ()=>{
        if(geoSettled)return;
        settle();
        const weather=await fetchWeather(25.033,121.565);
        if(weather&&capturedDate){
          ensureEntry(capturedDate);
          entries[capturedDate].weather=weather;
          saveMetaChange(capturedDate);
        }
        if(currentDate===capturedDate){
          const r=document.getElementById('weather-location-row');
          if(r)renderWLRow(r,weather,null,true);
        }
      },
      {timeout:2000}
    );
  } else {
    settle();
    renderWLRow(row,null,null,true);
  }
}

function renderWLRow(row,weather,location,locationDenied=false){
  if(!row)return;
  let html='';
  if(weather) html+=`<div class="wl-item"><span>${esc(weather)}</span></div>`;
  if(weather&&(location||locationDenied||!location)) html+=`<span class="wl-divider"></span>`;
  if(location){
    html+=`<div class="wl-item">
      <div class="location-wrap" id="loc-wrap" onclick="editLocation()">
        ${PIN_SVG}
        <span id="loc-text">${esc(location)}</span>
        <span class="location-edit-hint">✎</span>
      </div>
    </div>`;
  } else {
    // 未授權或尚無地點：顯示可點擊輸入
    html+=`<div class="wl-item">
      ${PIN_SVG}
      <span class="location-empty-hint" id="loc-empty" onclick="editLocationEmpty()">輸入地點...</span>
    </div>`;
  }
  row.innerHTML=html;
}

function editLocation(){
  const wrap=document.getElementById('loc-wrap');
  const textEl=document.getElementById('loc-text');
  if(!wrap||!textEl||wrap.querySelector('input'))return;
  const cur=textEl.textContent;
  const inp=document.createElement('input');
  inp.className='location-input-inline';
  inp.value=cur;
  textEl.style.display='none';
  wrap.querySelector('.location-edit-hint').style.display='none';
  wrap.style.cursor='default';
  wrap.appendChild(inp);
  inp.focus();inp.select();
  const confirm=async()=>{
    const val=inp.value.trim();
    const saved=val||cur;
    textEl.textContent=saved;
    textEl.style.display='';
    wrap.querySelector('.location-edit-hint').style.display='';
    wrap.style.cursor='pointer';
    inp.remove();
    if(entries[currentDate]){entries[currentDate].location=saved;saveMetaChange(currentDate);}
  };
  inp.addEventListener('blur',confirm);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();});
}

function editLocationEmpty(){
  const emptyEl=document.getElementById('loc-empty');
  if(!emptyEl)return;
  const inp=document.createElement('input');
  inp.className='location-input-inline';
  inp.placeholder='輸入地點名稱';
  emptyEl.replaceWith(inp);
  inp.focus();
  const confirm=async()=>{
    const val=inp.value.trim();
    if(val){
      if(entries[currentDate]){entries[currentDate].location=val;saveMetaChange(currentDate);}
      // 只替換地點元素，不重繪整列（避免天氣消失）
      const locItem=inp.closest('.wl-item');
      if(locItem){
        locItem.innerHTML='<div class="location-wrap" id="loc-wrap" onclick="editLocation()">'+PIN_SVG+'<span id="loc-text">'+esc(val)+'</span><span class="location-edit-hint">✎</span></div>';
      }
    } else {
      // 沒輸入，還原提示文字
      const locItem=inp.closest('.wl-item');
      if(locItem){
        locItem.innerHTML=PIN_SVG+'<span class="location-empty-hint" id="loc-empty" onclick="editLocationEmpty()">輸入地點...</span>';
      }
    }
  };
  inp.addEventListener('blur',confirm);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();});
}

async function fetchWeather(lat,lon){
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode&timezone=auto`;
    const r=await fetch(url);const d=await r.json();
    const temp=Math.round(d.current.temperature_2m);
    const code=d.current.weathercode;
    const desc=weatherDesc(code);
    return`${desc.emoji} ${temp}° ${desc.text}`;
  }catch(e){return null;}
}

function weatherDesc(code){
  if(code===0)return{emoji:'☀️',text:'晴'};
  if(code<=2)return{emoji:'⛅',text:'多雲'};
  if(code===3)return{emoji:'☁️',text:'陰'};
  if(code<=49)return{emoji:'🌫️',text:'霧'};
  if(code<=59)return{emoji:'🌦️',text:'毛毛雨'};
  if(code<=69)return{emoji:'🌧️',text:'雨'};
  if(code<=79)return{emoji:'🌨️',text:'雪'};
  if(code<=84)return{emoji:'🌧️',text:'陣雨'};
  if(code<=99)return{emoji:'⛈️',text:'雷雨'};
  return{emoji:'🌡️',text:''};
}

async function fetchLocation(lat,lon){
  try{
    const url=`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=zh-TW`;
    const r=await fetch(url,{headers:{'Accept-Language':'zh-TW'}});
    const d=await r.json();
    // 優先顯示景點/商場名，否則顯示區+市
    const a=d.address||{};
    return a.tourism||a.amenity||a.leisure||a.shop||a.building||
           [a.suburb||a.neighbourhood||a.quarter||a.city_district,a.city||a.town].filter(Boolean).join('，')||
           d.display_name?.split(',')[0]||null;
  }catch(e){return null;}
}

function renderOtd(){
  if(!currentDate)return;
  const mmdd=currentDate.slice(5),curYear=parseInt(currentDate.slice(0,4));
  const past=Object.keys(entries).filter(ds=>ds.slice(5)===mmdd&&parseInt(ds.slice(0,4))<curYear).sort((a,b)=>b.localeCompare(a));
  const eb=document.querySelector('.editor-bottom');
  const ex=document.getElementById('otd-wrap');if(ex)ex.remove();
  if(!past.length||!eb)return;
  const items=past.map(ds=>{
    const e=entries[ds];
    const title=e.title||plainOf(e).slice(0,40)||'（無內容）';
    const plain=plainOf(e);
    const preview=plain.slice(0,80);
    return `<div class="otd-item">
      <div class="otd-year">${ds.slice(0,4)} 年</div>
      <div class="otd-title">${esc(title)}</div>
      ${preview?`<div class="otd-preview">${esc(preview)}${plain.length>80?'…':''}</div>`:''}
      <button class="otd-read" onclick="openEntry('${ds}')">閱讀全文 →</button>
    </div>`;
  }).join('');
  const div=document.createElement('div');
  div.className='otd-wrap';div.id='otd-wrap';

  const header=document.createElement('div');
  header.className='otd-header';
  header.innerHTML='<span class="otd-left-bar"></span><span class="otd-toggle-label">今日回顧</span><span class="otd-toggle-arrow" id="otd-arrow">↓</span>';

  const body=document.createElement('div');
  body.className='otd-body';
  body.style.display='none';
  body.innerHTML=items;

  header.addEventListener('click',()=>{
    const open=body.style.display==='none';
    body.style.display=open?'block':'none';
    document.getElementById('otd-arrow').textContent=open?'↑':'↓';
  });

  div.appendChild(header);
  div.appendChild(body);
  eb.insertBefore(div,eb.firstChild);
}

function onInput(){
  setSaveStatus('saving');
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(()=>{
    flushCurrentToMemory();
    const ds=currentDate;
    if(conflictState&&conflictState.ds===ds){setSaveStatus('paused');if(entries[ds])lsSet(CACHE_PREFIX+ds,entries[ds].content||'');saveIndexCache();return;}  // v44：衝突未選擇前不存雲端；v46：先存本機
    if(isEntryBlank(ds)){setSaveStatus('');return;}  // v45：內容空白不存、不刪（離開這篇時才判斷刪除）
    persistEntry(ds).then(()=>{
      showSaveResult(ds);  // v46
    });
  },1500);
  updateWordCount();
}
function updateWordCount(){
  const wc=document.getElementById('word-count');
  if(!wc||!quill)return;
  const text=quill.getText().replace(/\n/g,'').trim();
  const count=[...text].length;

// 只更新 index 單筆（天氣、地點等 metadata 異動時用）
// v46：天氣、地點、心情改動 → 走一般存檔（.md＋index 一起寫），不再只寫 index
// .md 才是正本：只寫 index 的話，重建索引時這些修改會被還原
function saveMetaChange(ds){
  const e=entries[ds];
  if(!e||e._isNew||e._loadFailed)return;  // 新日記：第一次存檔時一起寫入（v45）
  if(ds===currentDate){
    // 內文還在載入：等載入完成再存，否則會用空白內文蓋掉雲端
    if(document.querySelector('#quill-mount .editor-loading')){e._pendingMeta=true;return;}
    flushCurrentToMemory();
    persistEntry(ds);
    return;
  }
  if(e.content){persistEntry(ds);return;}  // 內文在記憶體
  e._pendingMeta=true;  // 內文不在記憶體：下次打開這篇、內文載入後再存
}
// 打開日記、內文載入完成後：補存之前等待中的 metadata 改動
function flushPendingMeta(ds){
  const e=entries[ds];
  if(!e||!e._pendingMeta||e._loadFailed||currentDate!==ds)return;
  delete e._pendingMeta;
  flushCurrentToMemory();
  persistEntry(ds);
}
// 舊名稱保留，避免漏改的呼叫
async function doSaveIndexOnly(ds){saveMetaChange(ds);}
// doSave：flush DOM → persist 當前篇（autosave 和手動儲存用）
async function doSave(){
  if(!currentDate||!/^\d{4}-\d{2}-\d{2}$/.test(currentDate))return;
  flushCurrentToMemory();
  const ds=currentDate; // snapshot，避免 await 期間被改掉
  await persistEntry(ds);
  showSaveResult(ds);  // v46
}

// AI 錯誤訊息對照（v43：GAS 回傳明確的 error 種類，不再靜默失敗）
function aiErrorMessage(data){
  const err=data&&data.error;
  if(!data||data.__network)return 'AI 暫時無法連線，請稍後再試';
  if(data.quota||err==='quota')return '今日 AI 配額已用盡，明天再試';
  if(err==='model_unavailable')return 'AI 模型已停用，需更新 GEMINI_MODEL 設定';
  if(err==='truncated')return 'AI 回應被截斷，請再試一次';
  if(err==='blocked')return 'AI 無法回應這段內容';
  if(err==='empty')return 'AI 沒有回應，請再試一次';
  if(err==='unauthorized')return '暗號已失效，請重新輸入';
  if(err==='api_error')return 'AI 暫時無法連線（錯誤 '+(data.code||'')+'）';
  if(err)return 'AI 發生錯誤：'+err;
  return '';
}

async function analyzeMood(){
  // 開始時鎖定日期：分析期間若切換到別篇，結果仍寫回原本這篇，不會寫錯篇（v43）
  const ds=currentDate;
  if(!ds||!entries[ds])return;
  const content=getPlain(entries[ds].content||''),title=entries[ds].title||'';
  if(!content&&!title)return;
  const showMood=(text,ok)=>{
    if(currentDate!==ds)return;  // 已切到別篇就不動畫面
    const mv=document.getElementById('mood-val');
    if(!mv)return;
    mv.textContent=text;
    mv.style.opacity=ok?'1':'0.6';
    mv.classList.toggle('has-val',!!ok);
  };
  let data;
  try{
    const system='你是日記情緒分析助手，使用繁體中文。只輸出 JSON，格式：{"mood":"emoji+2-4字","tags":["標籤1","標籤2"]}，不要其他文字。';
    const prompt=`標題：${title}\n內容：${content.slice(0,500)}`;
    data=await callGAS('gemini',{system,prompt,json:true});
  }catch(e){
    console.error('[analyzeMood] 連線失敗:',e);
    data={__network:true};
  }
  const errMsg=aiErrorMessage(data);
  if(errMsg){console.error('[analyzeMood]',errMsg,data);showMood(errMsg,false);return;}
  // JSON 模式下回傳就是 JSON；保留 regex 擷取當作備援（例如換回不支援 JSON 模式的模型時）
  let parsed=null;
  const raw=(data&&data.text)||'';
  try{parsed=JSON.parse(raw);}catch(e){
    const match=raw.match(/\{[\s\S]*\}/);
    if(match){try{parsed=JSON.parse(match[0]);}catch(e2){}}
  }
  if(!parsed){console.error('[analyzeMood] 回傳內容無法解析成 JSON:',raw);showMood('AI 回應格式異常，請再試一次',false);return;}
  if(!entries[ds])return;  // 分析期間這篇被刪除
  if(parsed.mood){
    entries[ds].mood=parsed.mood;
    showMood(parsed.mood,true);
    saveMetaChange(ds);  // v46：心情寫回 .md 正本
  }
  if(Array.isArray(parsed.tags)&&parsed.tags.length){
    const ex=entries[ds].tags||[];
    // v47：AI 建議的標籤若含逗號，改成頓號（逗號會讓 .md 的標籤被拆開）
    const newSuggested=parsed.tags.filter(t=>typeof t==='string'&&t.trim()).map(t=>t.trim().replace(/[,，]/g,'、')).filter(t=>!ex.includes(t)).slice(0,3);
    if(newSuggested.length){
      pendingSuggestedTags[ds]=newSuggested;
      if(currentDate===ds)renderTagsRow(entries[ds].tags||[], newSuggested);
    }
  }
}

function renderTagsPage(){
