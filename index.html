// v46：標籤改名／刪除 → GAS 直接改寫各篇 .md 的 front matter（updateMetaBatch），每批 50 篇
let tagBusy=false;
function showTagProgress(done,total,label){
  const el=document.getElementById('tag-progress');
  if(!el)return;
  el.style.display='block';
  el.textContent=`正在${label}：${done}／${total} 篇`;
}
function hideTagProgress(){const el=document.getElementById('tag-progress');if(el)el.style.display='none';}
async function applyTagChanges(changes,label){
  const total=changes.length;
  const failed=[];
  if(!total)return {failed};
  showTagProgress(0,total,label);
  for(let i=0;i<total;i+=50){
    const chunk=changes.slice(i,i+50);
    let res=null;
    try{res=await callGAS('updateMetaBatch',{items:chunk.map(c=>({date:c.date,meta:{tags:c.tags}}))});}catch(e){res=null;}
    if(!res||!res.ok||!Array.isArray(res.results)){chunk.forEach(c=>failed.push(c.date));}
    else res.results.forEach(r=>{
      if(!r.ok){failed.push(r.date);return;}
      const e=entries[r.date];
      if(!e)return;
      // 內文沒變：本機快取若原本是最新的，就直接換成新版本號，不必重新下載
      const old=verStr(r.prevVersion);
      if(verStr(e._cver)===old)e._cver=r.updatedAt;
      if(lsGet(CACHE_PREFIX+r.date)!==null&&getCacheVer(r.date)===old)lsSet(CVER_PREFIX+r.date,verStr(r.updatedAt));
      e.updatedAt=r.updatedAt;
    });
    showTagProgress(Math.min(i+chunk.length,total),total,label);
  }
  saveIndexCache();
  hideTagProgress();
  if(failed.length)alert(`有 ${failed.length} 篇沒有更新成功（${failed.slice(0,5).join('、')}${failed.length>5?'…':''}），請檢查網路後重新整理，再操作一次。`);
  return {failed};
}

async function renameTag(oldName){
  if(tagBusy){alert('還在處理上一個標籤，請稍候');return;}
  const newName=prompt('重新命名標籤：', oldName);
  if(!newName||!newName.trim()||newName.trim()===oldName)return;
  const n=newName.trim();
  const nameErr=tagNameError(n);  // v47
  if(nameErr){alert(nameErr);return;}
  // 檢查目標名稱是否已存在
  const allTags=new Set();
  Object.values(entries).forEach(e=>(e.tags||[]).forEach(t=>allTags.add(t)));
  if(allTags.has(n)){
    if(!confirm(`標籤「${n}」已存在，確定要將「${oldName}」合併進去嗎？`))return;
  }
  // 先挑出真的含有舊標籤的日記（v46：原本會連「已經有新名稱」的日記也一起重寫）
  const affected=Object.keys(entries).filter(ds=>(entries[ds].tags||[]).includes(oldName));
  affected.forEach(ds=>{
    // 用目標名稱取代，並去重
    entries[ds].tags=[...new Set((entries[ds].tags||[]).map(t=>t===oldName?n:t))];
  });
  tagBusy=true;
  try{
    await applyTagChanges(affected.filter(ds=>!entries[ds]._isNew).map(ds=>({date:ds,tags:entries[ds].tags})),'改名');  // 新日記只改記憶體（v45）
  }finally{tagBusy=false;}
  renderTagsPage();
}

async function deleteTag(name){
  if(tagBusy){alert('還在處理上一個標籤，請稍候');return;}
  if(!confirm(`確定要刪除標籤「${name}」？
（不會刪除日記本身）`))return;
  // 修正（v37）：只挑刪除前真的含有這個標籤的日記
  const affected=Object.keys(entries).filter(ds=>(entries[ds].tags||[]).includes(name));
  affected.forEach(ds=>{
    entries[ds].tags=(entries[ds].tags||[]).filter(t=>t!==name);
  });
  if(activeFilterTag===name)activeFilterTag=null;
  tagBusy=true;
  try{
    await applyTagChanges(affected.filter(ds=>!entries[ds]._isNew).map(ds=>({date:ds,tags:entries[ds].tags})),'刪除標籤');
  }finally{tagBusy=false;}
  renderTagsPage();
}

async function showSearchResults(q){  // v45
  if(!(await leaveCurrentEntry()))return;

function _showSearchResults(q){
  // 切換 topbar 顯示
  const titleEl=document.getElementById('topbar-title');
  const stateEl=document.getElementById('search-state');
  const countEl=document.getElementById('search-count');
  const queryLabel=document.getElementById('search-query-label');
  titleEl.style.display='none';
  stateEl.style.display='flex';
  queryLabel.textContent=q;

  // 切換主區域
  document.getElementById('editor-page').style.display='none';
  document.getElementById('tags-page').style.display='none';
  document.getElementById('settings-page').style.display='none';
  const page=document.getElementById('list-page');
  page.style.cssText='flex:1;overflow-y:auto;display:flex;flex-direction:column;';

  // AND 搜尋：空格分割多關鍵字，全部要符合
  const keywords=q.split(/\s+/).filter(Boolean).map(k=>k.toLowerCase());

  const matched=Object.keys(entries).filter(ds=>{
    const e=entries[ds];
    const haystack=[
      e.title||'',
      plainOf(e),
      (e.tags||[]).join(' ')
    ].join(' ').toLowerCase();
    return keywords.every(k=>haystack.includes(k));
  }).sort((a,b)=>b.localeCompare(a));

  countEl.style.display='inline';
  countEl.textContent=matched.length+' 篇';

  if(!matched.length){
    page.innerHTML=`<div class="list-empty"><div style="font-size:32px;opacity:0.3;">🔍</div><div style="font-size:var(--fs-btn);">找不到符合「${esc(q)}」的日記</div></div>`;
    return;
  }

  page.innerHTML=`<div class="search-result-count">找到 ${matched.length} 篇日記</div>`+renderCardGroups(matched,{keywords});
}

// 可重複呼叫（例如存檔重試期間連續失敗），不會疊出多個畫面
function handleUnauthorized(){
  const had=!!getSecret();
  try{localStorage.removeItem(SECRET_KEY);}catch(e){}
  showLockScreen(had||appStarted);

async function submitUnlock(){
  if(unlockBusy)return;
  const inp=document.getElementById('lock-input');
  const btn=document.getElementById('lock-submit');
  const candidate=(inp?.value||'').trim();
  if(!candidate){setLockError('請輸入暗號');return;}
  unlockBusy=true;
  if(btn){btn.disabled=true;btn.textContent='驗證中…';}
  let res=null;
  try{
    // 用 readIndex 驗證：成功的話順便就拿到日記清單，交給 loadEntries 沿用
    res=await rawCallGAS(candidate,'readIndex');
  }catch(e){res=null;}
  unlockBusy=false;
  if(btn){btn.disabled=false;btn.textContent='解鎖';}
  if(!res){setLockError('無法連線，請檢查網路後再試');return;}
  if(res.error==='unauthorized'){setLockError('暗號不正確，請再試一次');if(inp)inp.select();return;}
  if(res.error){setLockError('連線失敗，請稍後再試');return;}
  try{localStorage.setItem(SECRET_KEY,candidate);}catch(e){setLockError('這個瀏覽器無法儲存暗號');return;}
  hideLockScreen();
  if(!appStarted){await startApp(res);}
  else{await loadEntries(res);renderSyncUI();}  // 使用途中暗號失效後重新解鎖：只重新載入資料，正在編輯的內容保留在記憶體
}

async function logoutDevice(){
  // v45：若還開著某篇日記，先照正常流程存檔，並等所有存檔完成後才判斷能不能登出

  const pending=getSyncPending().length;

  if(pending||inFlight){

  }
  if(!confirm('確定要登出這台裝置？\n\n會清除這台裝置上的暗號與日記快取，雲端資料不受影響。下次開啟需要重新輸入暗號。'))return;
  loggingOut=true;  // 重新整理時不要再觸發「畫面隱藏立即存檔」，以免清掉的快取又被寫回
  try{
    const keys=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k===SECRET_KEY||k===INDEX_CACHE_KEY||k===SYNC_PENDING_KEY||k===SAVING_KEY||(k&&k.indexOf(CACHE_PREFIX)===0)||(k&&k.indexOf(CVER_PREFIX)===0))keys.push(k);
    }
    keys.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  location.reload();
}

async function startApp(prefetched){
  appStarted=true;
  restoreSyncStateFromStorage();renderCal();showListPage();
  await loadEntries(prefetched);
  renderCal();renderEntryList();renderListPage();renderSyncUI();
}

async function init(){
  loadTheme();loadSettings();
  // 沒有暗號：只顯示鎖定頁，不渲染任何日記（包含本機快取）
  if(!getSecret()){showLockScreen(false);return;}
  await startApp();
}
function restoreSyncStateFromStorage(){
  // v45：上次存檔途中被中斷的篇目 → 轉成待同步
  const interrupted=getSaving();
  if(interrupted.length){
    const list=getSyncPending();
    interrupted.forEach(ds=>{if(!list.some(i=>i.date===ds&&i.type==='md'))list.push({date:ds,type:'md',failedAt:Date.now()});});
    setSyncPending(list);
    lsSet(SAVING_KEY,'[]');
  }
  getSyncPending().forEach(i=>{if(i.type==='md')mdSyncState[i.date]='failed';});
}
init();
</script>
